name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  checks:
    name: Shell lint and hook tests
    # Pinned, not ubuntu-latest: the run-task verdicts depend on GNU
    # timeout(1) (--foreground, exit 124 and 137), and a newer image may ship
    # another implementation. The first step makes such a change fail loudly.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: timeout(1) is GNU coreutils
        run: ./scripts/require-gnu-timeout.sh

      - name: Lint every shell script (bash -n + shellcheck)
        run: ./scripts/lint.sh

      - name: pre-commit hook behaviour in throwaway repos
        run: tests/pre-commit.test.sh

      - name: run-task verdicts against fake claude sessions
        run: tests/run-task.test.sh

      - name: stdin-queued-exit keeps the user's task.md and pong.txt
        run: tests/stdin-queued-exit.test.sh

      - name: the GNU timeout check rejects other implementations
        run: tests/require-gnu-timeout.test.sh
