name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  checks:
    name: Shell lint and hook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint every shell script (bash -n + shellcheck)
        run: ./scripts/lint.sh

      - name: pre-commit hook behaviour in throwaway repos
        run: tests/pre-commit.test.sh
